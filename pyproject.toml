[project]
name = "gpu-training"
version = "0.1.0"
description = "Hands-on GPU kernel curriculum for NVIDIA CUDA and Apple Silicon Metal, mapped to PMPP"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpuk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
