name: Release source package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish source archives
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Package the tagged commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0" >&2
            exit 1
          fi
          mkdir -p dist
          git archive --format=tar.gz --prefix="GPU-Training-$RELEASE_TAG/" \
            --output="dist/GPU-Training-$RELEASE_TAG.tar.gz" HEAD
          git archive --format=zip --prefix="GPU-Training-$RELEASE_TAG/" \
            --output="dist/GPU-Training-$RELEASE_TAG.zip" HEAD
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
