name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Python syntax, documentation links and result schemas
        run: python tools/check_repo.py
      - name: Check shell syntax
        run: bash -n tools/sync_cuda.sh
      - name: Validate GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' \
            --pattern 'actionlint_1.7.12_checksums.txt' \
            --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color

  cuda-build:
    name: CUDA 12.9 / sm_61 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends make g++ git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile all CUDA labs and PMPP examples
        run: make -C cuda -j2 all CUDA_HOME=/usr/local/cuda ARCH=sm_61
      - name: Upload compiled programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cuda-sm61-linux-x64
          path: build/cuda/
          if-no-files-found: error
          retention-days: 7
